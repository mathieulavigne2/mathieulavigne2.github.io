# ============================================================================
# CANONICAL PUBLICATION LIST — single source of truth for BOTH languages.
#
# R/build-listings.R generates research/publications.yml and
# fr/research/publications.yml from this file. Never edit those two; they are
# overwritten on every build.
#
# Fields
#   id            slug, must be unique
#   kind          article | chapter | report | working-paper
#                 (drives which section of the Research page it lands in)
#   date          YYYY-MM-DD, used for sorting. Approximate is fine.
#   year          display year. Use e.g. "Forthcoming, 2026" via `note`.
#   authors       display string. The template bolds "Mathieu Lavigne".
#   title         the title AS PUBLISHED, in whatever language it was
#                 published in. Never translate it — a cited work has one
#                 title, and rendering a French gloss of an English article
#                 makes it unsearchable and uncitable. French-language works
#                 (e.g. inconfort-indifference-2024) simply carry a French
#                 `title` in both renders.
#   title_fr      optional; falls back to `title`. ONLY for a work genuinely
#                 issued in a separate French edition under its own title.
#                 Not a translation field. Currently unused.
#   venue         journal / publisher / series
#   venue_fr      optional; falls back to `venue`
#   themes        ids from data/themes.yml
#   doi           bare DOI, no https://doi.org/ prefix
#   url           used when there is no DOI, or as an additional landing page
#   replication   replication files / data
#   note          short qualifier, e.g. "Forthcoming"
#   note_fr       optional
#
#   verify_doi    set true to have R/build-listings.R flag a DOI as unchecked
#
# DOI STATUS — checked 2026-08-06: all 14 DOIs here resolve, including all
#   nine CMTD-issued 10.66536/* ones (they 302 to mediatechdemocracy.com).
#   Worth recording why that was ever in doubt: the CMTD codebase sets
#   `doiRegistered: false` on all 144 of its publications and gates DOI
#   display on that flag, so its own site suppresses DOIs that are in fact
#   deposited. The flag lags reality; do not treat it as evidence.
#   Re-check with tools/check-links.py before publishing.
# ============================================================================

